<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EL Finans - Sayfa bulunamadı</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/images/favicon-192.png">
  <link rel="apple-touch-icon" href="/images/favicon-192.png">
  <link rel="preload" href="/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root { color-scheme: light dark; --accent: #2563eb; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(37, 99, 235, .14), transparent 60%), #f7f9fc;
      color: #0f172a;
    }
    main { max-width: 520px; text-align: center; }
    .logo { width: 72px; height: 72px; border-radius: 18px; }
    .code { margin: 20px 0 4px; font-size: 64px; font-weight: 700; color: var(--accent); letter-spacing: -1px; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 0 6px; color: #475569; line-height: 1.55; }
    .en { color: #64748b; font-size: 15px; }
    nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
    a.btn {
      padding: 12px 20px; border-radius: 12px; font-weight: 600; text-decoration: none;
      background: var(--accent); color: #fff;
    }
    a.btn.secondary { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
    a.btn:focus-visible { outline: 3px solid rgba(37, 99, 235, .45); outline-offset: 3px; }
    @media (prefers-color-scheme: dark) {
      body { background: radial-gradient(1200px 600px at 20% 0%, rgba(37, 99, 235, .28), transparent 60%), #0b1220; color: #e2e8f0; }
      p { color: #a8b3c7; }
      .en { color: #8a96ab; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/images/logo-nav.png" alt="EL Finans" width="72" height="72">
    <div class="code" aria-hidden="true">404</div>
    <h1>Aradığınız sayfa bulunamadı</h1>
    <p>Bağlantı değişmiş ya da sayfa kaldırılmış olabilir.</p>
    <p class="en" lang="en">The page you are looking for could not be found.</p>
    <nav aria-label="Sayfa bağlantıları">
      <a class="btn" href="/">Ana sayfa</a>
      <a class="btn secondary" href="/support">Destek</a>
    </nav>
  </main>
</body>
</html>
